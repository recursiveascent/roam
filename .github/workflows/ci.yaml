name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # roam is macOS-only (cgo against Network.framework); the flake supports
    # only aarch64-darwin and x86_64-darwin. macos-latest is Apple Silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        run: nix develop --command make build

      - name: Check
        run: nix develop --command make check
