name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    # roam is macOS-only (cgo against Network.framework). Pin macOS 15:
    # Network.framework crashes under TSan on the macOS 26 hosted runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: recursiveascent
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check
      - run: nix build
      - run: make check
        shell: 'nix develop -c bash -e {0}'
